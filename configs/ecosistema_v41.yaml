# CERNO v4.1 · Ecosistema del club: altas, bajas e impacto cruzado (ENCARGO v4.1, revisión 1.0 del 06-11-2026;
# docs/encargos/v4.1_ecosistema.md). Capa E, ENCIMA de la capa 4 de la v4.0.
# La v4.1 AÑADE; no sustituye: normalización v3.2, simulador/motor de minutos v3.3 y capas 1–5 de la v4.0 se CONSUMEN sin
# tocarlas (configs/equipo_v40.yaml sigue siendo su única fuente). Todo hiperparámetro de la v4.1 vive AQUÍ; el código no fija
# ninguno. Los criterios del §6 del encargo se transcriben en `criterios` (congelación en la puerta F0, §0.3.2).
version: "v4.1"
base:
  rama: claude/encargo-v4-f0-startup-zw1jvo           # v4.0 cerrada (V40_F5 §6: «APROBADA … ENCARGO v4.0 CERRADO»)
  commit: 6fb6abd
  config_v40: configs/equipo_v40.yaml                 # β (F1), φ (F2-A), dirigidos (F2-B), h (F3), capa 4, A5, NC, IM
salida: data/modelos/v4_1
mlflow: ecosistema_v41                                # experimento MLflow (experimentos/mlruns, no versionado)
semilla: 20261106                                     # semilla general de la v4.1; cada bloque deriva la suya (crc32 de su clave)
checkpoints: docs/checkpoints                         # V41_F<k>.md

# ---------------------------------------------------------------------------------------- comunes (§0.3.4, §6)
comunes:
  cortes: [2021, 2022, 2023, 2024]
  corte_calibracion: 2021
  cortes_decision: [2022, 2023, 2024]
  fuente_perfiles_corte: V32_corte                    # perfiles ≤ t sin fuga
  pesos_composicion_por_corte: true
  bootstrap: 2000
  bootstrap_por: equipo_temporada
  semilla_bootstrap: 20261106
  nivel_rango: 0.80                                   # todo valor visible: punto + rango del 80 % + sello (§0.3.8)
  segmentos:
    elite_club: [euroleague, eurocup, acb]            # «EuroLeague + EuroCup + ACB» del encargo
    global: todas

# ---------------------------------------------------------------------------------------- F0 · prueba de orden de sinergias (§2.2, F0.4)
orden_sinergias:
  temporadas: ["2020-21", "2021-22", "2022-23", "2023-24", "2024-25", "2025-26"]   # §2.2: 2020-21 a 2025-26 (2026-27 en curso fuera)
  tramos: contrato_v40                                # basura fuera, 5 contra 5, ≥ 1 posesión (configs/equipo_v40.yaml → contrato)
  tercios_por: partido                                # por liga-temporada, los partidos se reparten en 3 tercios al azar
  rotaciones: 3                                       # cada tercio ajusta una vez el modelo aditivo; los otros dos miden
  ordenes: [1, 2, 3, 5]                               # 1 jugador (sub-unidad de la pareja), 2 pareja, 3 trío, 5 quinteto
  min_posesiones_tercio: 150                          # unidades con ≥ 150 posesiones en CADA uno de los dos tercios de medida
  peso: h_armonico                                    # h = 1/(1/n_A + 1/n_B)
  propio: residuo_unidad_menos_media_subunidades      # pareja − media de sus 2 jugadores; trío − media de sus 3 parejas;
                                                      # quinteto − media de sus 10 tríos (mismo tercio)
  fijos: [intercepto, clutch, playoffs]               # efectos fijos sin penalizar en las dos versiones
  version_a:                                          # (a) RAPM ridge simple, λ por validación interna
    lambda_rejilla: [300, 1000, 3000, 10000, 30000, 100000]   # penalización en unidades de posesión (τ² = σ²/λ)
    pliegues_validacion: 3                            # por partido, dentro del tercio de ajuste
  version_b:                                          # (b) β de F1 v4.0 como modelo aditivo
    prior: data/modelos/v4_0/rapm_multiliga           # g(x̃) del producto F1 (columna `prior`, por persona-temporada)
    tau: 2.0                                          # τ del producto F1 (GBM; V40_F1) — se re-resuelve el posterior en cada tercio
    sigma: null                                       # null → g_prior.json → net.sigma (185,46 pts/100 por posesión)
  calibracion_nula:                                   # [añadido v4.1] sesgo del estimador bajo «sin sinergia»
    replicas: 3                                       # y* = ŷ_aditivo(todo) + ε*, ε* ~ N(0, σ̂²_lt / n_s); misma tubería
  calibracion_plantada:                               # [añadido v4.1] factor de atenuación k_o de la medida «propia»
    sd: 2.0                                           # DT del efecto propio sembrado (pts/100), un orden cada vez
    ordenes: [2, 3, 5]
    replicas: 1
  prueba_predictiva:                                  # segunda prueba del §2.2: efectos de unidad encima del aditivo
    ordenes: [2, 3, 5]
    lambda_rejilla: [100, 1000, 10000, 100000, 1000000]
    pliegues_validacion: 3
    bootstrap_partidos: 1000                          # IC95 por liga-temporada (bootstrap de partidos del tercio de medida)
  fiabilidad_posesiones: [150, 500, 1000]             # fiabilidad de la unidad propia a estas exposiciones
  tolerancia_reproduccion:                            # (a) frente a las cifras del §2.2 (calculadas en el chat del proyecto)
    regla: el punto de (a) cae dentro del rango del 80 % publicado en el §2.2 y viceversa
  referencia_chat:                                    # cifras del §2.2 [DATO del chat, pendiente de reproducir]
    todas: {pareja: [1.66, 1.41, 1.89], trio: [0.82, 0.48, 1.18], quinteto: [0.73, -1.44, 2.72]}
    elite_club: {pareja: [1.28, 0.66, 1.92], trio: [1.35, 0.23, 2.40], n_pareja: 8167, n_trio: 1472, n_quinteto: 8}
    fiabilidad_pareja_150: [0.03, 0.05]

# ---------------------------------------------------------------------------------------- F0 · modelo mixto (orden del CEO, 06-11-2026)
sinergia_mixta:                                       # estimador PRINCIPAL de la prueba de orden: REML con jugadores y unidades
  modelo: y = F·f + Σβ_A − Σβ_B + Σu_A − Σu_B + ε;  β ~ N(m, τ²) (τ por ℓt);  u_o ~ N(0, σ_o²) común entre ℓt
  etapas: {a: [2], b: [2, 3, 5]}                      # (b) β de F1 como media a priori = modelo aditivo del producto
  rejilla:                                            # DT del efecto propio verdadero (pts/100); 0 = sin el bloque
    "2": [0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 2.5, 3.0]
    "3": [0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 2.5, 3.0]
    "5": [0.0, 0.5, 1.0, 2.0, 3.0, 4.0]
  q_max_denso: {"2": 12000, "3": 14500, "5": 17500}   # efectos por ℓt en Cholesky densa; parejas ≤ 12.000 deja fuera NCAA 2025-26 y
                                                      # FEB3 2023-24 a 2025-26 (17–21 mil efectos; ≈ 30 min por ℓt), declarado
  segmento_por_etapa: {"2": global, "3": elite_club, "5": elite_club}   # tríos y quintetos en EL + EC + ACB: coste y, sobre todo,
                                                      # la calibración plantada (la pareja ya no es identificable; el trío menos)
  plantada: {version: a, sds: [1.0, 2.0, 3.0, 4.0], segmento: global}   # umbral de detección sobre el diseño y el ruido REALES
                                                      # (se ejecutó en dos tandas: 1–2 y 3–4; plantada_a_global_ampliado.json las une)
  ruido:                                              # [añadido tras la calibración plantada sobre datos reales, 06-11-2026]
    modelo: ampliado                                  # «simple» = σ²/n e independencia: sesgaba σ_o hacia 0 (sembrando σ = 1 en
                                                      # el segmento élite, devolvía 0). «ampliado» = estado del marcador + varianza
    margen_cortes: [-14.5, -7.5, -2.5, 2.5, 7.5, 14.5]  # margen del local al inicio del tramo; tramo base (−2,5, 2,5]
    interaccion_ultimo_cuarto: true                   # efectos de marcador distintos en el último cuarto y la prórroga
    varianza: "σ²·(1/n + c/n²), c por ℓt"             # exceso de ruido de los tramos cortos (estimador de posesiones)
    lambda_primer_ajuste: 3000                        # ridge del ajuste aditivo previo que estima c
  intervalos: [perfil_verosimilitud, bootstrap_ligas_temporada]
  contraste_cero: lrt_mezcla_chi2_0_1

# ---------------------------------------------------------------------------------------- capa XP · puntos esperados (CEO, 07-11-2026)
# Punto esperado de cada tiro y sus agregados (tiro → tramo → jugador). Planteamiento: docs/puntos_esperados.md.
# AMPLIABLE: cada campo se declara en `catalogo` (grano, definición, unidad, estado) y se implementa con @campo en
# bbequipo/ecosistema/puntos_esperados.py; tests/test_ecosistema_v41.py comprueba que catálogo y código coinciden.
# Estados: validado (pasó un examen) · experimental (calculado, sin examen) · propuesto (sólo declarado, sin código).
puntos_esperados:
  version_modelo: xp1                                 # xp1 = acierto por zona × liga-temporada; TL por tirador contraído
  temporadas: ["2020-21", "2021-22", "2022-23", "2023-24", "2024-25", "2025-26", "2026-27"]
  zonas: [aro, corta, media, t3_esquina, t3_frontal]  # bbmodel/zonas.py (distancia al aro y geometría de la línea)
  sin_coordenadas: sin_zona                           # tiro sin coordenadas: tasa de su tipo (T2/T3) en la liga-temporada
  calibracion_coordenadas: data/modelos/pista/calibracion.json
  umbral_acierto_calibracion: 0.95                    # por debajo, la liga-temporada usa sólo el tipo (T2/T3)
  contraccion:
    zona_hacia_tipo: 200                              # p_zona = (anotados + m·p_tipo)/(intentos + m), m en intentos
    tl_tirador_hacia_liga: 50                         # TL% del tirador = (TLa + m·p_liga)/(TLi + m)
  tl_modelo: tirador_contraido                        # [tirador_contraido | liga]
  resultado_tramo_capa_e: "0.75·y_real + 0.25·y_xp"   # adoptado por la regla de beneficio_xp (07-11-2026) para los modelos NUEVOS
  emparejamiento_tramos: {por: [game_id, quinteto, quinteto_rival], ventana: [t0, t1]}
  salidas:
    versionado: data/modelos/v4_1/puntos_esperados   # modelo por liga-temporada, jugadores, calidad
    no_versionado: experimentos/v4_1/puntos_esperados   # tiros y tramos anotados (≈ 9 M de tiros; regenerables)
  catalogo:
    # ---- grano tiro (una fila por tiro de campo o tiro libre)
    zona:            {grano: tiro, unidad: categoria, estado: experimental, def: "zona del tiro de campo; TL = tiro_libre; sin coordenadas = sin_zona"}
    dist_m:          {grano: tiro, unidad: m, estado: experimental, def: "distancia al aro (tiros con coordenadas calibradas)"}
    p_acierto:       {grano: tiro, unidad: proporcion, estado: experimental, def: "probabilidad de anotar según el modelo (zona × liga-temporada; TL: tirador contraído)"}
    xp:              {grano: tiro, unidad: puntos, estado: experimental, def: "punto esperado del tiro = p_acierto × valor (2, 3 o 1)"}
    residuo_tiro:    {grano: tiro, unidad: puntos, estado: experimental, def: "puntos − xp (acierto por encima o por debajo de lo esperado)"}
    asistido:        {grano: tiro, unidad: bool, estado: experimental, def: "canasta con asistencia registrada (sólo anotados)"}
    # ---- grano tramo (una fila por tramo de quinteto del contrato v4.0)
    xp_a:            {grano: tramo, unidad: puntos, estado: experimental, def: "puntos esperados del local en el tramo (campo + libres)"}
    xp_b:            {grano: tramo, unidad: puntos, estado: experimental, def: "puntos esperados del visitante en el tramo"}
    pts_tiros_a:     {grano: tramo, unidad: puntos, estado: experimental, def: "puntos del local reconstruidos desde los tiros (control de emparejamiento)"}
    pts_tiros_b:     {grano: tramo, unidad: puntos, estado: experimental, def: "puntos del visitante reconstruidos desde los tiros"}
    y_xp:            {grano: tramo, unidad: pts/100, estado: experimental, def: "100·(xp_a − xp_b)/posesiones: diferencial esperado del local (sin la suerte del tiro)"}
    # ---- grano jugador (una fila por liga × temporada × equipo × jugador; fases del contrato juntas)
    tiros_campo:     {grano: jugador, unidad: intentos, estado: experimental, def: "tiros de campo"}
    tiros_libres:    {grano: jugador, unidad: intentos, estado: experimental, def: "tiros libres"}
    intentos_ts:     {grano: jugador, unidad: intentos, estado: experimental, def: "tiros de campo + 0,44·tiros libres"}
    puntos_tiro:     {grano: jugador, unidad: puntos, estado: experimental, def: "puntos anotados en sus tiros"}
    xp_campo:        {grano: jugador, unidad: puntos, estado: experimental, def: "suma de xp de sus tiros de campo"}
    xp_libres:       {grano: jugador, unidad: puntos, estado: experimental, def: "suma de xp de sus tiros libres"}
    xp_total:        {grano: jugador, unidad: puntos, estado: experimental, def: "xp_campo + xp_libres"}
    pps:             {grano: jugador, unidad: puntos/intento, estado: experimental, def: "puntos_tiro / intentos_ts"}
    xpps:            {grano: jugador, unidad: puntos/intento, estado: experimental, def: "xp_total / intentos_ts: puntos esperados por intento"}
    calidad_seleccion: {grano: jugador, unidad: puntos/tiro, estado: experimental, def: "xp_campo / tiros_campo: valor esperado medio de los tiros que elige"}
    acierto_sobre_esperado: {grano: jugador, unidad: puntos/intento, estado: experimental, def: "(puntos_tiro − xp_total) / intentos_ts"}
    acierto_sobre_esperado_campo: {grano: jugador, unidad: puntos/tiro, estado: experimental, def: "(puntos de campo − xp_campo) / tiros_campo"}
    acierto_sobre_esperado_contraido: {grano: jugador, unidad: puntos/tiro, estado: experimental, def: "acierto_sobre_esperado_campo contraído por bayes empírico (varianza entre jugadores de la liga-temporada)"}
    fiabilidad_acierto: {grano: jugador, unidad: proporcion, estado: experimental, def: "peso del jugador en la contracción: parte del acierto observado que no es ruido"}
    tl_pct_contraido: {grano: jugador, unidad: proporcion, estado: experimental, def: "TL% contraído hacia la liga (el que usa el modelo)"}
    pct_tc_aro:      {grano: jugador, unidad: proporcion, estado: experimental, def: "% de sus tiros de campo en el aro"}
    pct_tc_corta:    {grano: jugador, unidad: proporcion, estado: experimental, def: "% en zona corta"}
    pct_tc_media:    {grano: jugador, unidad: proporcion, estado: experimental, def: "% de media distancia"}
    pct_tc_t3_esquina: {grano: jugador, unidad: proporcion, estado: experimental, def: "% de triples de esquina"}
    pct_tc_t3_frontal: {grano: jugador, unidad: proporcion, estado: experimental, def: "% de triples frontales"}
    pct_tc_sin_zona: {grano: jugador, unidad: proporcion, estado: experimental, def: "% sin coordenadas"}
    poss_on:         {grano: jugador, unidad: posesiones, estado: experimental, def: "posesiones en pista (tramos del contrato v4.0)"}
    xortg_on:        {grano: jugador, unidad: pts/100, estado: experimental, def: "puntos esperados del equipo por 100 posesiones con él en pista"}
    xdrtg_on:        {grano: jugador, unidad: pts/100, estado: experimental, def: "puntos esperados del rival por 100 con él en pista"}
    xnet_on:         {grano: jugador, unidad: pts/100, estado: experimental, def: "xortg_on − xdrtg_on: Net en pista sin la suerte del tiro"}
    net_on:          {grano: jugador, unidad: pts/100, estado: experimental, def: "Net real en pista, mismos tramos (referencia de xnet_on)"}
    net_off:         {grano: jugador, unidad: pts/100, estado: experimental, def: "Net real del equipo SIN él en pista (totales del equipo − en pista), mismos tramos (F2-d)"}
    xnet_off:        {grano: jugador, unidad: pts/100, estado: experimental, def: "xNet del equipo sin él en pista (F2-d)"}
    net_onoff:       {grano: jugador, unidad: pts/100, estado: experimental, def: "net_on − net_off: on/off bruto con los tramos del contrato (F2-d)"}
    xnet_onoff:      {grano: jugador, unidad: pts/100, estado: experimental, def: "xnet_on − xnet_off: on/off sin la suerte del tiro (F2-d; diagnóstico del Impacto en pista y objetivo de F2-e)"}
    # ---- propuestos (declarados para el futuro; sin código todavía)
    xp_creado_asistencias: {grano: jugador, unidad: puntos, estado: propuesto, def: "xp de los tiros de compañeros que asiste (exige registrar también las asistencias de tiros fallados o un modelo de pase)"}
    xp_permitido_defensor: {grano: jugador, unidad: pts/100, estado: propuesto, def: "xp concedido por el rival con él en pista, por zona (protección del aro, defensa del triple)"}
    xp_distancia_continua: {grano: tiro, unidad: puntos, estado: propuesto, def: "xp2: acierto como función continua de la distancia y el ángulo (spline), no por zonas"}
    xp_contexto:     {grano: tiro, unidad: puntos, estado: propuesto, def: "xp2: corrección por asistencia, marcador, cuarto y tiempo restante"}
    xp_rebote_ofensivo: {grano: tiro, unidad: puntos, estado: propuesto, def: "valor esperado de la segunda oportunidad tras un fallo (rebote ofensivo esperado)"}

# ---------------------------------------------------------------------------------------- efecto mínimo detectable (CEO, 07-11-2026)
potencia:                                             # OBLIGATORIO en todo examen de F1–F3 antes de usarlo para decidir
  objetivo: 0.80                                      # potencia con la que se define el efecto mínimo detectable (EMD)
  replicas_minimas: 20                                # réplicas sembradas por δ
  regla: >-
    El EMD se mide sembrando el efecto sobre los datos REALES y repitiendo el examen tal y como está prerregistrado. Si el
    EMD es mayor que el umbral que la puerta exige (o que el efecto plausible declarado), el examen NO es informativo: no
    decide, y se declara así en el checkpoint junto con su curva de potencia.
  trios:                                              # primera aplicación: puerta F3-T (§6.3)
    umbral_dt: 0.10                                   # la puerta exige DT de φ̂_trío ≥ 0,10 pts/100
    deltas: [0.10, 0.25, 0.50, 1.0, 2.0]              # DT sembradas (pts/100)
    replicas: 20
    bootstrap: 300                                    # partidos, estratificado por liga-temporada (por réplica)
    lambda_rejilla: [1.0e+2, 1.0e+3, 1.0e+4, 1.0e+5, 1.0e+6, 1.0e+7, 1.0e+8]   # ridge de los rasgos de perfil estandarizados,
                                                      # elegido por validación cruzada anidada (sin tocar el tercio de evaluación)
    max_jugadores_lt: 1200                            # deja fuera FEB3 y NCAA por memoria (diseño denso)

# ---------------------------------------------------------------------------------------- prueba de beneficio del punto esperado (07-11-2026)
beneficio_xp:                                         # PRERREGISTRADO antes de ejecutar (bbequipo/ecosistema/beneficio_xp.py)
  temporadas: ["2020-21", "2021-22", "2022-23", "2023-24", "2024-25", "2025-26"]
  alfas: [0.0, 0.25, 0.5, 0.75, 1.0]                  # y_α = α·y_real + (1 − α)·y_xp
  min_pos_estabilidad: 300                            # posesiones del jugador en CADA mitad para la correlación de β
  regla: >-
    Se adopta y_α con α < 1 como resultado de tramo de los modelos NUEVOS de la capa E si su R² fuera de muestra del
    diferencial REAL supera al de α = 1 con IC95 de la diferencia > 0 en el global y no es peor en el segmento élite
    (IC95 inferior de la diferencia > −0,002); entre los que cumplen, el de mayor R² global. Si ninguno cumple, se mantiene
    el resultado real. Los modelos cerrados de la v4.0 (β de F1 y demás) no se reajustan.
  resultado: {alfa_adoptado: 0.75, fecha: 2026-11-07, por: regla_prerregistrada}   # [DECISIÓN por regla] V41_F0 §11.2:
                                                      # R² del diferencial real +0,00039 [0,00017; 0,00059] global y +0,00038
                                                      # [0,00013; 0,00067] élite frente a α = 1; α = 0 empeora (−0,0038)

# ---------------------------------------------------------------------------------------- F0 · benchmark de decisión sobre la v4.0 (F0.3)
benchmark:
  insumos:
    nc_examen: data/modelos/v4_0/equipo/anclas/nc_examen.csv.gz
    im_examen: data/modelos/v4_0/equipo/anclas/im_examen.csv.gz
    f4_examen: data/modelos/v4_0/equipo/examen
  top_k: [10, 25, 50]                                 # ordenación top-k por NC dentro de liga-corte
  rol_oraculo: true                                   # minutos y rol reales de t+1 como si los fijara el analista
  minutos_limites: {fiba: 40, nba: 48}                # intervalos del motor v3.3 dentro de [0, duración del partido]
  club_cliente:                                       # backtest SOLO en agregados; nunca nombres (F0.7: única fuente del club)
    club: baskonia
    ids: {acb: "3", euroleague: "BAS"}                # team_id del club en cada competición (data/processed/<t>/quintetos/<liga>/equipos.csv)

# ---------------------------------------------------------------------------------------- F0 · auditoría de ausencias (F0.5, §5.4)
ausencias:
  rotacion_min_cuota_minutos: 0.075                   # DECISIÓN CEO 06-11-2026 (P1): ≥ 7,5 % de los minutos TOTALES de jugador del
                                                      # equipo (Σ = 1) ≈ 15 min por partido de 40' (18' en la NBA). El 15 % literal
                                                      # del §5.4 (≈ 30') dejaba 116 partidos con un único ausente: V-AUS inviable
  umbrales_alternativos: [0.15, 0.03]                 # sólo auditoría (el literal y ≈ 6'), para la trazabilidad
  fase: regular
  jugo_antes_y_despues: true                          # 0 minutos en el partido, con partidos jugados antes y después
  varios_ausentes: banco_aparte_V-AUS-M               # DECISIÓN CEO 06-11-2026 (P3): V-AUS = partidos con UN ausente; los de varios,
                                                      # banco V-AUS-M (escenario de varias bajas, informativo, sin decidir sellos)
  decision_tecnica:                                   # DECISIÓN CEO 06-11-2026 (P2): no se separa (el acta no está en los datos)
    separar: false
    diagnostico: longitud_racha                       # aislada (1 partido) frente a racha (≥ 2) [HIPÓTESIS], sólo estratificación
    acta_en_extraccion: no_autorizada                 # opción abierta si en F3 los resultados quedan ambiguos

# ---------------------------------------------------------------------------------------- F1 · motor de escenarios (§3.1–3.2)
f1:
  api: ecosistema.simular(R, altas=[(id, rol)], bajas=[id], cfg)
  minutos: motor_v33                                  # condicionado al rol fijado de las altas; existentes con su rol de partida
  rol_partida: {verano: ultima_temporada, mitad_temporada: temporada_en_curso}
  minutos_partido: {fiba: 200, nba: 240}
  minutos_intervalos:                                 # DECISIÓN CEO 06-11-2026 (P5, workaround): el motor v3.3 NO se toca
    recorte: [0, duracion_partido]                    # cada jugador en [0, 40|48] y Σ = 200|240 en cada simulación
    recalibracion: conformal_cortes_anteriores        # la capa E recalibra SUS rangos de minutos (50/80/90 %) con los residuos
                                                      # de los cortes anteriores (como la capa 4), corrigiendo la cola superior
                                                      # saturada del v3.3 (extremo 90 % = 80 % en el 97,7 % de las fichas)
    objetivo_cobertura: {"0.8": [0.75, 0.85], "0.9": [0.85, 0.95]}
    tramos_fraccion_partido: [0.25, 0.45, 0.65]       # tramos de m̂/duración para los cuantiles de residuo (bbequipo/ecosistema/minutos_cal.py)
  uso_suma: 1.0
  uso_medio_pista: 20.0                               # Σ minutos·USG = 20·Σ minutos: los cinco en pista suman el 100 % del uso
  uso_amortiguar: 1.0                                 # la capa E redistribuye TODO el desajuste (la v3.3 por fichaje usa 0,5); con 1
                                                      # la suma del 100 % se cumple exactamente (test del encargo)
  monte_carlo: {simulaciones: 1000, semilla_derivada: escenarios}
  shapley:
    exacto_hasta: 4                                   # |M| ≤ 4 exacto; si no, permutaciones
    permutaciones: 500                                # |M| > 4: permutaciones al azar (caché de subconjuntos; error MC declarado)
    error_mc_declarado: true
  descomposicion: [reemplazo_beta_h_minutos, sinergia_parejas_phi, sinergia_trios_phi3]
  valor_de_baja: delta_net_sin_el                     # nombre provisional «Valor de baja» (confirmar con el CEO)
  paridad_capa4_tolerancia: 0.01                      # pts/100
  examen:                                             # examen de la F1 (§6.1) sobre equipos reales (examen_escenarios.py)
    temporada_base: "2025-26"                         # última temporada completa con plantillas, β y motor de producto
    simulaciones: 600
    muestra_resto: 60                                 # equipos al azar fuera de EL + EC + ACB (todos los de élite entran)

# ---------------------------------------------------------------------------------------- F2 · Impacto en pista (§3.3)
f2:
  # PRERREGISTRO de la F2 (08-11-2026), escrito ANTES de calcular nada. Decisiones del CEO del 08-11-2026: puerta F1
  # aprobada (E1, E2, E5); F2-a opción (a); F2-b, F2-c, F2-d y F2-e aprobados.
  definicion: v_j(R) = β_j + h(z_j) + Σ_k π_jk(R)·φ_jk [+ γᵀ c_j(R)] [+ δ·Σ_k π_jk·g(f_jk)]   # sin tríos (F3-T cerrada)
  pi: fraccion_posesiones_de_j_con_k                  # π_jk = P_jk / p_j con P_jk ≈ p_j p_k · 10 / Σ_{i<l} p_i p_l (capa 4)
  beta_sd: muestreado                                 # β_j ~ N(β̂_j, sd_j) por simulación → v_j tiene distribución predictiva
  escala: 100 · E_pred[F_grupo(v_j)]                  # percentil esperado; F_grupo = v̂ de los jugadores del mismo grupo de liga y corte
  calibracion: isotonica_cortes_anteriores_frente_a_percentil_onoff   # como el IM de la v4.0 (V40_F5 §3.1)
  rango: deciles_cortes_anteriores                    # cuantiles 10/90 del percentil on/off por decil de crudo (cortes anteriores)
  poblacion: grupo_liga                               # elite / domestica_alta / resto (como IM v4.0)
  examen:
    poblacion_principal: fichajes_del_examen_im_v40   # MISMAS filas que im_examen.csv.gz (comparación PAREADA con el IM v4.0)
    poblacion_secundaria: todos_los_jugadores_300min  # informada, no decide
    realizado: net_rtg_aj_onoff                       # P4: on/off ajustado bruto, ≥ 300 min en t+1 (player_role_season)
    aditivo_referencia: IM_aditivo                    # «superior al aditivo» = la misma línea base del IM v4.0 (β × minutos, 0,031)
    diagnostico_beta_solo: true                       # además, frente a β solo (¿aporta el contexto algo?); informado, no decide
    bootstrap: equipo_temporada                       # B de comunes; IC95 de diferencias pareadas
    contextualidad:
      poblacion: jugadores que siguen en el mismo equipo de t a t+1, con ≥ 300 min en ambas y ≥ 1 alta o baja de rotación
      prediccion: v_j(R_t+1) − v_j(R_t)               # R_t con sus minutos observados; R_t+1 real con minutos del motor (≤ t)
      realizado: Δ del percentil on/off (dentro de temporada y grupo de liga, jugadores ≥ 300 min)
  regla_si_no_alcanza_im_v40: >-                      # DECISIÓN F2-a del CEO (opción a)
    Si el Impacto en pista no cumple la monotonía frente al IMPACTO v4.0 (o la calibración o la cobertura), el IMPACTO v4.0
    sigue siendo el ancla publicada y el Impacto en pista se muestra como EXPERIMENTAL (sin sello) hasta que pase.
  contexto_cj:                                        # candidato (§5.2 del encargo)
    componentes: [nivel_medio_companeros, perfil_medio_companeros_4]   # Σ_k π_jk β_k / Σ π_jk y Σ_k π_jk u_k / Σ π_jk (u = 4 comp. de F2-A)
    ajuste: regresion_cortes_anteriores               # γ por mínimos cuadrados ponderados con los cortes < t (sin fuga)
    objetivo: on/off con 25 % menos de suerte de tiro # F2-e: net_rtg_aj_onoff − 0,25·(net_onoff_real − xnet_onoff), de la capa XP
    entra_si: mejora la monotonía con IC95 de la diferencia > 0 (pareada, equipo-temporada)
    riesgo_declarado: circularidad (el RAPM de la temporada absorbe parte del contexto, β ≈ +0,40 por unidad de nivel)
  familiaridad:                                       # F2-c: candidato nuevo
    definicion: f_jk = posesiones que j y k compartieron en pista (mismo lado) en la temporada t−1; g(f) = log(1 + f/100)
    examen_tramo: >-
      δ por tramo, conjunto con el RAPM ridge de cada liga-temporada (FWL: δ = x̃ᵀW y / x̃ᵀW x, x = Σ_{parejas A} g − Σ_{parejas B} g),
      y = 0,75·y_real + 0,25·y_xp (F2-e), IC95 robusto por partido, agregado por inverso de la varianza
    emd: analitico_estimador_lineal                   # (1,96 + 0,84)·EE agregado: exacto para un estimador lineal (sembrar δ·x lo desplaza en δ)
    entra_si: δ con IC95 que excluye 0 Y mejora la monotonía del Impacto con IC95 > 0
  diagnostico_xnet_onoff: true                        # F2-d: on/off sin la suerte del tiro (capa XP), sólo informativo
  nivel_cerno_por_escenario: true                     # F2-b: NC₁/NC₂ de cada jugador con sus compañeros del escenario
  potencia:                                           # regla de la F0: EMD antes de decidir
    monotonia: sembrar una señal con Spearman conocido frente al on/off real (permutación parcial) y medir la tasa de detección
    contextualidad: idem sobre el Δ realizado

# ---------------------------------------------------------------------------------------- F3 · validación del impacto cruzado y bajas
f3:
  # PRERREGISTRO de la F3 (09-11-2026), escrito ANTES de calcular. Orden del CEO: «Apruebo la puerta F2 con G1 a G6 y
  # arranca la F3». Código: bbequipo/ecosistema/bancos.py (bancos y predicciones) y examen_f3.py (sellos).
  bancos: [V-AUS, V-MID, V-TRANS]
  metricas_cruzadas: [minutos, usg_pct, cuota_tiro, pct_asistidas, pts_p100, ts_pct, efg_pct, ortg, ast_pct, reb_pct]
  metricas_examinadas: [minutos, uso, cuota_tiro, pct_asistidas, pts100]     # las que tienen vía de predicción (motor y F2-B)
  candidatos_sin_via: [ts_pct, efg_pct, ortg, ast_pct, reb_pct]              # §3.4: sin modelo con examen → sello BAJA por regla
  lineas_base: [delta_0, redistribucion_proporcional]
  fuente_partidos: data/modelos/roles/partidos_jugador/<temporada>.csv.gz    # fase regular; métricas por partido y jugador
  definiciones_observadas:                            # agregadas sobre un CONJUNTO de partidos (sumas, no medias de cocientes)
    minutos: media de minutos por partido (0 si en el acta del equipo sin jugar)
    uso: 100·Σ(fga + 0,44·fta) / Σ(team_fga_on + 0,44·team_fta_on)   # uso de tiro en pista (escala del USG del motor, media 20)
    cuota_tiro: 100·Σ fga / Σ team_fga_on             # igual que bbmodel.interacciones (F2-B)
    pct_asistidas: 100·Σ fgm_asist / Σ fgm
    pts100: 100·Σ pts / Σ poss_on
    net_equipo: 100·(Σ pts a favor − Σ pts en contra) / (Σ poss_on del equipo / 5)
  pesos_mae:                                          # media armónica de la exposición en los dos conjuntos de partidos
    minutos: partidos
    uso: team_tsa_on
    cuota_tiro: team_fga_on
    pct_asistidas: fgm
    pts100: poss_on
    net_equipo: posesiones
  minimo_exposicion: {partidos: 1, team_fga_on: 20, fgm: 5, poss_on: 30, posesiones: 50}   # por conjunto, para entrar en una métrica
  prediccion:                                         # TODO con información ≤ t (corte t) para la temporada t+1
    minutos: motor v3.3 de los pesos ≤ t (InsumosCorte.minutos) con y sin el movimiento, mismos números aleatorios; P5
    uso: uso natural traducido a la liga (≤ t) + suma fija (redistribuir_uso, amortiguar 1) con los minutos de cada escenario
    f2b: −π_kj·d̂(j→k) (baja) o +π_ka·d̂(a→k) (alta) con los GBM de F2-B ≤ t (dirigidos/examen/modelos_corte_<t>) y π del motor
    net_equipo: c_cal(corte, grupo)·ΔT de la capa 4 (T con β, φ, h ≤ t; c del examen v4.0 de la capa 4, cortes anteriores)
    rol_altas: oraculo                                # V-MID y V-TRANS: rol realizado del alta (player_role_season.rol)
  redistribucion_proporcional:                        # línea base (ii); sin modelo, con datos ≤ el momento del movimiento
    minutos: Δm_k = ±m_x · m_k / Σ_{l ∉ movs} m_l (los minutos liberados o absorbidos por x, en proporción a los minutos previos)
    cuotas: "Δs_k = ±(m_x/gm)·(s_x − 20)·s_k/(100 − s_x), s ∈ {uso, cuota_tiro}: x se sustituye por un jugador de cuota media (20)
      y el exceso se reparte en proporción a la cuota previa; m_x/gm = prob. de coincidir (independencia)"
    pts100: Δp_k = p_k · Δuso_k(ii) / uso_k           # los puntos acompañan al uso
    pct_asistidas: 0                                  # sin noción de reparto: (ii) = (i) [declarado]
  intervalos: conformal_cortes_anteriores             # q10/q90 del residuo (obs − pred) de los cortes < t por tercil de peso
                                                      # (2021: en muestra, sólo calibra); incluye el ruido de la observación
  bootstrap: equipo_temporada                         # B de comunes; IC95 de la diferencia de MAE ponderado (base − modelo)
  v_aus:
    evento: (equipo, temporada, j) con ≥ 1 partido sin j (único ausente de rotación, P1/P3) y ≥ 3 con j sin ausentes de rotación
    compañeros: jugadores con fila en los dos conjuntos y minutos > 0 en ambos
    observado: métrica(partidos sin j) − métrica(partidos con j)
  v_mid:
    evento: alta a de un equipo en la fase regular con su primer partido entre el 15 % y el 85 % del calendario del equipo,
      ≥ 3 partidos del equipo antes y ≥ 5 jugados por a después, y a de rotación después (≥ 7,5 % de los minutos)
    resto_constante: ningún OTRO jugador de rotación (≥ 7,5 % en alguna ventana) aparece sólo en una de las dos ventanas
    observado: métrica(después) − métrica(antes)
  v_trans:
    evento: (club, t → t+1) con jugadores que siguen (≥ 300 min en las dos), plantillas reales (mapa de clubes de la v3.2)
    prediccion: motor(R_t+1, altas con rol oráculo) − motor(R_t), F2-B de las altas (+) y de las bajas (−)
    observado: métrica de la temporada t+1 − métrica de la temporada t (mismas definiciones, temporada completa)
  sello_por_metrica: >-
    Por banco, la regla congelada criterios.f3_sellos (ALTA / MEDIA / BAJA) con la cobertura del 80 % agregada en los cortes de
    decisión. Sello final de la métrica = el menor entre el de V-AUS y el MEJOR de los otros dos bancos (§6.4: «banco V-AUS y al
    menos un banco más»).
  valor_de_baja: ΔNet del equipo en V-AUS frente a (i), como la capa 4 (mejora a Δ = 0 con IC95 que excluye 0; cobertura en rango)
  potencia: >-
    EMD sembrado sobre los datos reales (regla de la F0): y* = b + κ·(p − b) + e*, con e* los residuos reales de la línea base
    permutados dentro de corte; se busca el κ con detección ≥ 0,80 (IC95 de MAE_base − MAE_modelo > 0); 20 réplicas.
  endogeneidad_declarada: descansos en partidos sin nada en juego y lesiones tras sobrecarga (V-AUS); fichajes a mitad de
    temporada por lesión o mal rendimiento (V-MID); envejecimiento y desarrollo (V-TRANS)
  trios:
    modelo: descomposicion_cp_sobre_z                 # φ_jkl de rango bajo sobre los perfiles z
    rango_candidatos: [1, 2, 3]
    ajuste_sobre: residuo_f1_f2_h
    min_posesiones_tercio_unidad: 150                 # §5.3: por debajo, ruido; la sinergia de trío sale sólo de perfiles

# ---------------------------------------------------------------------------------------- F4 · producto (sólo con orden expresa)
f4:
  retirar: [indice_fit, adapt_pct]                    # bajas aprobadas en la regla de oro
  terminos_nuevos_pendientes_ceo: [Landing, "FIABILIDAD ALTA · MEDIA · BAJA", "Valor de baja", "Impacto en pista"]
  orden_ceo: "09-11-2026 · «Arranca la F4 con marca Kerno.»"
  terminos_decididos_09-11-2026:                      # DECISIÓN CEO (respuestas del 09-11-2026)
    sellos: "Confianza alta · moderada · baja"        # vocabulario y medidor de tres segmentos de la marca Kerno; regla del examen igual
    adaptacion: Landing                               # mismo término en ES y EN (glosario i18n); sustituye a ADAPT %
    valor_de_baja: "Coste de su ausencia"             # ΔNet del equipo sin el jugador (sello MEDIA, V41_F3); EN: «Cost of his absence»
    impacto_en_pista: no_se_muestra_en_la_ficha       # sólo en el motor de escenarios y documentos técnicos hasta que pase su examen
  marca: Kerno                                        # skill cerno-brand v2.0 (Racing · Chalk · Ink · Brass; Bombardier, Mona Sans, Geist Mono)
  capturas: {anchos: [1440, 390], temas: [claro, oscuro]}
  candidata: https://claude.ai/artifact/HKJYKNWXoxgQDsYnFw3HR1   # versión 6 (1794216997-5f60); V41_F4
  decision_ceo_09-11-2026:                            # puerta F4 (V41_F4 §8): «Apruebo la puerta F4 con K1, K2, K5 y K4 con "RAPM proyectado"»
    K1: aprobado                                      # producto de la candidata (sin Fit ni ADAPT, Landing, confianza, panel del ecosistema)
    K2: aprobado                                      # sellos «propuesto» del §3 tal como están; reexamen en la v4.2 de los que no tienen examen propio
    K4:
      etiqueta: "RAPM proyectado"                     # sustituye a «Impacto en pista» y a «Valor v4.0» (el β RAPM v4.0 del jugador)
      escala: "[0, 100] en todas las etiquetas de índice del artifact"   # orden expresa del CEO: homogeneizar con escalado sencillo
      transformacion: "S₀₁ = 50 + S/2 = 100·logística(z) (S = 100·tanh(z/2), la escala ±100 vigente); 50 = referencia"
      diferencias: "ΔS₀₁ = ΔS/2 (diferencias entre dos valores de la escala; conservan el signo)"
      no_cambia: "unidades físicas (minutos, pts/100, %, posesiones) y los índices ya en [0, 100] (NIVEL KERNO, IMPACTO, ajuste)"
    K3: "examen de las dos tablas de adaptación y Landing sobre una sola (bloque k3_landing)"
    K5: aprobado                                      # publicar en el artifact principal tras fusionar con la otra sesión
    publicado: "https://claude.ai/artifact/A7rufkL84rvRFcUBFBxFbC · versión 23 (1794220601-81fd) · 09-11-2026"
    intervalos: "el CEO pide ideas para no mostrar rangos tan anchos (p. ej. «Por necesidad»: 80 [51–95]); decide tras la propuesta"
  k3_landing:                                         # PRERREGISTRO 09-11-2026, escrito y subido ANTES de calcular
    pregunta: "¿qué tabla de adaptación representa mejor el escalón de la primera temporada en la liga nueva?"
    objetivo: "o = log(L_rel observado / 100): rendimiento compuesto de la temporada frente a lo esperado tras la normalización (ŷ)"
    poblacion: "traspasos observados de destino t+1 con t en {2022, 2023, 2024} (validacion_casos de la fase 7, métrica L_rel)"
    pesos: w_ipcw_test                                # censura (quien deja de jugar en la liga nueva)
    candidatos:
      A_fase7_v3_2: "Δ de temporada de la fase 7 rehecha (v3_2): media del grupo de log(previsto/100), modelo ajustado ≤ t (sin fuga)"
      B_v3_1: "log(1 + D_g·w̄_g) de la adaptación v3 (la del motor y la Landing de la candidata); tabla publicada, con fuga a su favor"
      base: "0 (sólo la normalización)"
    grupo: grupo_nacionalidad                         # el de la Landing
    medidas:
      mae: "MAE ponderado de o − p por corte y conjunto; diferencias A − B, A − base, B − base con IC95 bootstrap por persona (B = 2000)"
      representatividad: "grupos con n ≥ 30 en los cortes de decisión: proporción en que la predicción cae en el IC80 de la media observada del grupo; acuerdo de signo"
      cobertura_80: "sólo A, que trae intervalo de predicción por traspaso"
    regla:
      eleccion: "gana el de menor MAE conjunto si el IC95 de A − B excluye 0; si no, el de mayor representatividad; si empatan, el de menor MAE puntual"
      fuga: "si B gana o empata, se reajusta B por corte sin fuga antes de decidir (B lleva la fuga a su favor)"
      sello: "ALTA si mejora a la base con IC95 que excluye 0 en los tres cortes; MEDIA si sólo en el conjunto; BAJA si no"
      producto: "la Landing sale sólo de la tabla elegida; se muestra el grupo si su rango del 80 % excluye 0 (si no, «sin cambio apreciable»)"
      motor: "no se toca el motor v3.3 (regla del encargo); si gana A, se informa la consecuencia en el motor como decisión del CEO"

# ---------------------------------------------------------------------------------------- §6 · criterios PRERREGISTRADOS
# Transcripción literal del §6 del encargo. Estado: «propuesto en F0» → se congela al aprobar el CEO la puerta F0 (con o sin
# los ajustes de `propuestas_ajuste`). Ningún resultado de F1–F3 se ha calculado al escribir este bloque.
criterios:
