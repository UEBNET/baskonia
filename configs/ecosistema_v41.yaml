    corte_calibracion: 2021
    segmentos: [elite_club, global]
    ic95: bootstrap_equipo_temporada
  f1:
    paridad_capa4_pts100: 0.01
    restricciones_fisicas: 1.0                        # 100 % de los escenarios: Σ minutos exacta, uso = 100 %, minutos de cada
                                                      # jugador en [0, 40|48] tras el recorte de la capa E (P5)
    minutos_cobertura_recalibrada: {"0.8": [0.75, 0.85], "0.9": [0.85, 0.95]}   # P5: cobertura de los rangos recalibrados
    resultado_examen_07-11-2026:                      # V41_F1 §2–3 (escenarios/examen_f1.json, minutos_calibracion.json)
