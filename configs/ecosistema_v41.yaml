      familiaridad: "δ +0,38 [0,35; 0,41] pero no mejora la monotonía (+0,002 [−0,005; 0,009]): no entra; POST HOC: selección"
      regla_f2a: "aplicada: el IMPACTO v4.0 sigue como ancla; el Impacto en pista se muestra EXPERIMENTAL"
    decision_ceo_09-11-2026: "puerta F2 APROBADA con G1–G6 (V41_F2 §10.1): IMPACTO v4.0 ancla; Impacto en pista EXPERIMENTAL;
      c_j NO se adopta; familiaridad cerrada; cambio por altas/bajas con sello BAJA; arranca la F3"
  f3_trios:
    estado: cerrada_sin_ejecutar_07-11-2026           # DECISIÓN CEO (D4): examen no informativo (EMD > 2 pts/100 frente a 0,10;
                                                      # V41_F0 §11.3); motor en orden 2; ablación negativa en potencia/trios_elite_club.json
    poblacion: tríos nuevos en t+1 sin coincidencia previa ≤ t
    reduccion_error_ic95_superior_menor_que_0_en_cortes: [2022, 2023, 2024]
