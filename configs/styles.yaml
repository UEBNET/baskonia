    jugador: "Tirador de recepción: espera en la esquina o en el ala y tira tras pase; apenas bota ni pierde balones."
    firma: {triple: 1, esquina: 1, aro: -1, autocreacion: -1, tiros_libres: -0.5}
  pistons:
    nombre: "Pistons"
    color: "#C0392B"
    rol_jugador: "Ala de energía"
    definicion: "Intensidad física: robos, faltas, ataque al aro y rebote ofensivo, con triple de esquina; poco balón en las manos."
    equipo: "Equipo físico y de presión: roba, hace faltas, ataca el aro y pelea el rebote ofensivo; en ataque, triple de esquina."
    jugador: "Ala atlético de energía: defiende con robos y contacto, ataca el aro sin balón, rebotea y tira desde la esquina."
    firma: {robos: 1, faltas: 1, esquina: 0.5, aro: 0.5, reb_ofensivo: 0.5}
  circulacion:
    nombre: "Circulación"
    color: "#16A085"
    rol_jugador: "Conector"
    definicion: "Juego de pase lejos del aro: triple y asistencias; poco rebote ofensivo, pocos tapones y pocos tiros en el aro."
    equipo: "Equipo de juego exterior: mucho triple (también de esquina), pocos tiros en el aro y poco rebote ofensivo; el balón circula por fuera."
    jugador: "Conector exterior: base o escolta que pasa, tira de tres y no ataca el aro."
    firma: {asistencia: 1, triple: 0.5, autocreacion: 0.5, reb_ofensivo: -1, tapones: -0.5}
  isolation:
    nombre: "Isolation"
    color: "#8E44AD"
    rol_jugador: "Creador"
    definicion: "Creación individual: muchas canastas sin asistencia y mucho pase con el balón en las manos; más pérdidas, poco rebote ofensivo."
    equipo: "Equipo de uno contra uno: muchas canastas sin pase previo, poco triple y casi nada de rebote ofensivo."
    jugador: "Creador con balón: fabrica su tiro y el de los demás (bote, bloqueo directo) y asume pérdidas."
    firma: {autocreacion: 1, asistencia: 1, perdidas: 0.5, tiros_libres: 0.3, triple: -0.3}
  old_school:
    nombre: "Old-School"
    color: "#B9770E"
    rol_jugador: "Interior clásico"
    definicion: "Juego interior clásico: rebote ofensivo, tiros cerca del aro y tapones; poco triple y poco pase."
    equipo: "Equipo de estructura tradicional: ataque por dentro y segundas opciones; tira menos de tres que su liga."
    jugador: "Interior clásico o ala-pívot de contacto: finaliza tras pase cerca del aro, rebotea y tapona, sin abrirse al triple."
    firma: {reb_ofensivo: 1, aro: 0.5, tapones: 0.5, asistencia: -0.5, autocreacion: -0.5, triple: -0.5}
  pintura:
    nombre: "Pintura"
    color: "#E67E22"
    rol_jugador: "Pívot dominante"
    definicion: "Juego en la pintura: casi ningún triple, muchísimos tiros en el aro y tiros libres, rebote ofensivo, tapones y faltas."
    equipo: "Equipo que vive dentro: ataca el aro, la línea de personal y el rebote ofensivo; apenas tira de tres."
    jugador: "Interior dominante: termina en el aro, saca faltas, captura rebotes ofensivos y protege el aro."
    firma: {aro: 1, tiros_libres: 1, reb_ofensivo: 1, tapones: 1, faltas: 1, triple: -1, esquina: -1}
  vertigo:
    nombre: "Vértigo"
    color: "#F1C40F"
    rol_jugador: "Penetrador"
