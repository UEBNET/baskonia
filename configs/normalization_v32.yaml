# Normalización cruzada v3.2: v3.1 (combinación de la v2 con la CVAE jerárquica) con las mejoras B1, B2, B4, B5 y B6
# (docs/normalizacion_v32.md), elegidas con cortes anidados y la regla de la navaja. La v3.1 sigue intacta en
# configs/normalization_v31.yaml y data/modelos/v3_1.
# Todo hiperparámetro vive aquí; el código no fija ninguno. Semillas fijas → resultados reproducibles.
version: "v3.2"
salida: data/modelos/v3_2
# B5: deep ensemble de 20 redes (las 5 primeras son las de la v3.1 y las de la ablación B1)
semillas: [20261029, 20261030, 20261031, 20261101, 20261102, 20261103, 20261104, 20261105, 20261106, 20261107,
           20261108, 20261109, 20261110, 20261111, 20261112, 20261113, 20261114, 20261115, 20261116, 20261117]
referencia_salida: {liga: euroleague, temporada: "2025-26"}    # vara del dataset normalizado (igual que v1/v2)

datos:
  min_minutos: 100              # filas jugador-liga-temporada que entran en el entrenamiento
  min_minutos_escala: 300       # filas que fijan la estandarización global de cada métrica
  min_minutos_puente: 150       # «puente» para la ponderación de selección (igual que normalization.yaml)

latente:
  K: 8                          # dimensión del latente z (elegida con el corte 2022-23 → 2023-24; ver elegir-k)
  K_candidatos: [4, 8, 12]

prior:
  eta: 0.08                     # z_{i,t+1} = z_{i,t} + d(edad) + η (DT de z por temporada)
  prior_por_persona: false      # true: el prior N(μ_c, s²) pesa 1/temporadas en cada temporada (una vez por persona)
  kappa: 0.10                   # paseo aleatorio del nivel μ_{l,t} entre temporadas
  tau: 0.35                     # μ medio de la liga ~ N(μ_escalón, τ²)
  sd_escalon: 2.0               # μ_escalón ~ N(0, 2²): previa débil
  sd_log_escala: 0.30           # log s_l ~ N(0, 0,3²): dispersión de la capacidad en la liga (análogo de s_l del A)
  escala_por_liga: false        # v3.1: s_l = 1. En la v3.0 la escala libre de la Tercera FEB se degeneró (s = 15,6)

red:
  oculta_decodificador: 32
  oculta_codificador: 128
  sd_film: 0.30                 # FiLM por liga (γ_l − 1, β_l) ~ N(0, 0,3²): contraído hacia la red común
  sd_cabezal_liga: 0.10         # cabezal residual por liga V_l ~ N(0, 0,1²)
  decaimiento_pesos: 1.0e-4
  psi_minimo: 0.005             # ψ_{l,m} ≥ 0,005 (varianza de contexto no explicada)
  s2_equipo_minimo: 0.005       # varianza mínima del efecto equipo-temporada (bayes empírico)
  unicidad: true                # factor específico persona × métrica ζ ~ N(0, ω²_m) (ω² por EM)
  film: true                    # B1: FiLM por liga (γ_l, β_l)
  cabezal_liga: true            # B1: cabezal residual por liga V_l
  verosimilitud: student        # B6: t de Student (normal = v3.1)
  nu_rango: [3, 30]             # B6: ν_m por métrica, estimado y acotado
  nu_inicial: 10

entrenamiento:
  pasos: 2500
  lr: 0.004
  lr_final: 0.0004
  ciclo_peso: 0.5               # penalización de consistencia de ciclo (codificar ∘ decodificar_b ≈ identidad)
  ciclo_filas: 2048             # filas por paso para el término de ciclo
  ipw: true
  recorte_ipw: [0.01, 0.99]

escalones:                      # mismos escalones que configs/normalization.yaml
  elite: [euroleague, nba]
  domestica_alta: [acb, lba, bbl, lnb, bsl, gbl, vtb, nbl]
  domestica_media: [bnxt, cba]  # 31-10-2026: escalón nuevo (asignación fijada de antemano, sin mirar resultados)
  universitaria: [ncaa]         # NCAA top-50: escalón propio; el desarrollo se separa con el tramo NCAA (bbmodel.enlace)
  copas_europeas: [eurocup, bcl, fec]
  desarrollo: [gleague]
  feb1: [feb1]
  feb2: [feb2]
  feb3: [feb3]

prediccion:
  muestras: 200                 # Monte Carlo por jugador (posterior de z, de μ, η, equipo, ψ y ruido de muestra)
  margen_soporte: 0.25          # soporte = rango observado en la liga de destino ± 0,25 DT
  recorte_centro: false         # v3.2 (§11c): el soporte sólo marca la extrapolación; no recorta el centro (la
                                # distancia fuera del soporte se suma como varianza)
  intervalo: 0.80

combinacion:                    # mezcla de la v2 (<m>_am) y la CVAE, en la escala de trabajo de cada métrica
  peso_v3: 0.5                  # reparto general de la v3.1 (punto de partida y valor para métricas sin decisión)
  peso_por_metrica: true        # B2: peso de la CVAE por métrica, elegido con cortes anidados entre pesos_candidatos
  peso_por: metrica             # §9 (02-11-2026): ŵ = argmin MAE en los cortes anteriores, pero sólo se aparta de 0,5
  mejora_minima: 0.01           # si IC95,sup[MAE(ŵ)/MAE(0,5) − 1] < −1 % (bootstrap por persona × corte)
  bootstrap: 1000
  min_temporadas_liga: 2        # salvaguarda: liga de origen o destino con < 2 temporadas en el ajuste → sólo v2
  max_discrepancia_redes: 0.5   # salvaguarda: sd entre las 5 redes de la CVAE > 0,5 DT en esa métrica → sólo v2
  ligas_conocimiento: [feb3]    # ajuste ESPECÍFICO por conocimiento previo (con sobreajuste asumido por el CEO; igual
                                # que en la v3.1, prevalece sobre el peso por métrica en los casos de la Tercera FEB)
  pesos_candidatos: [0.0, 0.25, 0.5, 0.75, 1.0]
  peso_v3_conocimiento: null    # peso de la CVAE en los casos con origen o destino en esas ligas; lo fija
                                # `python -m bbnorm3 --config configs/normalization_v31.yaml validar-combinada`
  factor_intervalo_conocimiento: null   # factor de anchura del intervalo en esos casos (también se fija con el examen)

validacion:
  anios: [2023, 2024]           # examen: ajusta con ≤ t, predice t+1 (igual que bbmodel validar)
  anio_seleccion: 2022          # primer corte de decisión (cortes anidados: ablacion.cortes_decision)
  anio_calibracion: 2021        # corte que sólo recalibra los intervalos del 2022
  # líneas base de la v2 rehechas con las 20 ligas para TODOS los cortes (2021-2024): sin_mapeo_<a>.csv.gz y b.csv
  lineas_base_dir: data/modelos/v3_2/validacion/lineas_base
  lineas_base_seleccion: data/modelos/v3_2/validacion/lineas_base
  min_casos_grupo: 30           # grupos origen → destino con menos casos usan la calibración global
  bootstrap: 2000               # remuestreo por persona del IC 95 % de la diferencia de MAE
  semilla_bootstrap: 20261029
  cobertura_objetivo: [0.78, 0.85]

inferencia:
  refinar_pasos: 200            # B4: inferencia semiamortizada (optimiza r de cada fila con el decodificador congelado);
                                # 0 = amortizada (v3.1). Se somete a la regla de la navaja (ablacion.piezas)

ablacion:                       # B1 + B4 + B6 (bbnorm3/ablacion.py)
  semillas: 5                   # redes por variante en la ablación (las 5 primeras de `semillas`); la final usa 20
  cortes: [2021, 2022, 2023, 2024]   # 2021 sólo calibra el corte 2022 (recalibración conforme con el corte anterior)
  cortes_decision: [2022, 2023, 2024]  # cortes anidados: la decisión que se aplica en t usa sólo los cortes < t
  hilos: 1                      # hilos de torch por proceso (4 procesos × 1 hilo ≈ 4,6 veces más rápido que 1 × 4)
  procesos: 4
  # Regla (criterios matemáticos del 02-11-2026, §8, aprobados ANTES de ver resultados; sustituye a la navaja
  # «IC95,inf ≤ 0» del primer plan): se evalúa la MEZCLA con peso fijo 0,5 (no la red sola), con la media por
  # familias de métricas y un bootstrap anidado (personas × corte y semillas con reemplazo, por separado para «con» y
  # «sin»). Se QUITA la pieza si IC95,sup(Δ_mezcla) < margen (no inferioridad), la cobertura recalibrada del 80 % sin
  # ella sigue en cobertura_objetivo y pasan las salvaguardas (ciclo: todas; niveles: obligatoria para la IPW). Se
  # CONSERVA si IC95,inf > 0; entre medias, «indeterminada» (se conserva). Si se quitan ≥ 2 piezas, la combinación
  # debe cumplir la regla frente a la completa en el corte siguiente (si no, se reincorporan una a una).
  evaluar_sobre: mezcla_w05
  media: familias               # bbnorm3.ablacion.FAMILIAS (7 familias de las 33 métricas)
  margen: 0.005                 # no inferioridad: +0,5 %
  bootstrap: 1000
  bootstrap_semillas: true
  salvaguardas: {ciclo_ratio: 1.25, ciclo_umbral_dt: 0.5, niveles_sd: 1.0}
  salvaguarda_niveles_obligatoria: [ipw]
  # pieza: variante SIN la pieza (cambios sobre esta configuración)
  piezas:
    ciclo: {entrenamiento.ciclo_peso: 0.0}
    film: {red.film: false}
    cabezal_liga: {red.cabezal_liga: false}
    unicidad: {red.unicidad: false}
    ipw: {entrenamiento.ipw: false}
    K8: {latente.K: 4}
    student: {red.verosimilitud: normal}
    refinado: {inferencia.refinar_pasos: 0}     # B4: sólo inferencia (mismas redes)

destino:                        # vara de salida = liga de destino (cualquier liga a 0; bbnorm3/destino.py)
  temporada: "2025-26"          # temporada de referencia de cada vara (μ, τ de la liga de destino)
  margen_soporte: 0.25          # recorte al rango observado de la liga de DESTINO ± 0,25 DT (en la v3.1, de la EuroLeague)
