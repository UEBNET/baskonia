  bloques_con_fuerza: [tiro]
contexto:
  cortes: [2023, 2024, 2025]          # temporadas objetivo de las que se construye la base F4 (sin fugas)
  cortes_prueba: [2024, 2025]         # se prueba en éstas, entrenando con las anteriores
