<style>
/* KERNO Analytics · armazón de la app (v2.0 de la herramienta) · sistema de marca Kerno v2.0
   Concepto: instrumento de lectura. Cabecera Racing con el contexto fijo (club · temporada · entrenador), raíl de decisión
   numerado 01–04 a la izquierda y un área de trabajo donde cada estimación se lee como punto + rango + confianza.
   Racing = marca y autoridad · Sage = neutros · latón = solo la lectura (un filete por pantalla) · Lake/Clay = datos. */
@font-face { font-family: "Bombardier"; src: url("kerno/fonts/Bombardier.woff") format("woff"); font-weight: 400; font-display: block; }
@font-face { font-family: "Mona Sans"; src: url("kerno/fonts/MonaSans-Variable.woff2") format("woff2"); font-weight: 200 900; font-stretch: 75% 125%; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url("kerno/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }

/* ------------------------------------------------------------------ tokens Kerno (kerno-base.css, Anexo B) */
:root {
  /* núcleo */
  --k-racing: #0F2E25; --k-ink: #0C1210; --k-chalk: #F3F4F0; --k-white: #FFFFFF;
  --k-brass: #B8975C; --k-brass-deep: #8A6B35;
  --k-r900: #0F2E25; --k-r800: #163B30; --k-r700: #1F4A3D; --k-r600: #2C5C4C; --k-r300: #7FA597; --k-r100: #DCE7E2;
  --k-s900: #1D2723; --k-s800: #2B3631; --k-s700: #3F4B45; --k-s600: #56625C; --k-s500: #707B75;
  --k-s400: #8F9993; --k-s300: #B2BAB5; --k-s200: #CFD5D0; --k-s100: #E3E7E2;
  --k-good: #2F7D3A; --k-warning: #A86A12; --k-critical: #B3392E;
  --k-lake: #2B6FBF; --k-clay: #D35C2A; --k-jade: #12997A;
  --k-div-1: #B04A20; --k-div-2: #D9805A; --k-div-6: #6F9AD3;

  /* alias semánticos · claro (Chalk) */
  --surface: var(--k-chalk); --surface-2: var(--k-white); --raised: var(--k-s100);
  --text: var(--k-ink); --text-2: var(--k-s700); --muted: var(--k-s600); --faint: var(--k-s500);
  --rule: var(--k-s200); --rule-strong: var(--k-racing); --field-line: var(--k-s300);
  --brand: var(--k-racing); --on-brand: var(--k-chalk); --brand-hover: var(--k-r700);
  --read: var(--k-brass-deep); --link: var(--k-racing); --focus: var(--k-brass-deep);
  --grid: var(--k-s200); --track: var(--k-s100); --context: var(--k-s400); --ctx-band: var(--k-s200);
  --s1: #2B6FBF; --s2: #D35C2A; --s3: #12997A;
  --band: rgba(15, 46, 37, .14); --hl-row: var(--k-r100);
  --callout-bg: var(--k-racing); --callout-text: var(--k-chalk); --callout-read: var(--k-brass);
  /* datos: Lake por encima de la media, Clay por debajo, Sage en la zona media o en estilo */
  --b-hi: rgba(43, 111, 191, .22); --b-lo: rgba(211, 92, 42, .22); --b-mid: rgba(15, 46, 37, .14); --b-neu: rgba(112, 123, 117, .18);
  --p-hi: #2B6FBF; --p-lo: #D35C2A; --p-mid: var(--k-racing); --p-neu: var(--k-s500);
  --v-pos: #2B6FBF; --v-neg: #B04A20;
  /* cabecera y portadas */
  --head-bg: var(--k-racing); --head-text: var(--k-chalk); --head-muted: var(--k-s300); --head-line: var(--k-r700); --head-field: var(--k-r800);
  --hero-bg: var(--k-racing); --hero-text: var(--k-chalk); --hero-muted: var(--k-s300); --hero-line: var(--k-r600);
  --hero-estela: url("kerno/patterns/kerno-estela-bleed-racing.svg");
  --loader: url("kerno/motion/kerno-loader-chalk.svg");
  --shade: rgba(12, 18, 16, .42);
  --f-display: "Bombardier", "Mona Sans", sans-serif;
  --f-sans: "Mona Sans", sans-serif;
  --f-serif: "Mona Sans", sans-serif; /* alias heredado: ya no hay serif */
  --f-mono: "Geist Mono", monospace;
  --ease: cubic-bezier(.2, 0, 0, 1);
  --rail: 256px; --head: 64px;
  color-scheme: light;
}
/* modo oscuro sobre Racing: tarjetas R800, reglas R700, texto Chalk, secundario S300, llamadas en Ink, lectura en Brass */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --surface: var(--k-racing); --surface-2: var(--k-r800); --raised: var(--k-r800);
  --text: var(--k-chalk); --text-2: var(--k-s300); --muted: var(--k-s400); --faint: var(--k-s500);
  --rule: var(--k-r700); --rule-strong: var(--k-chalk); --field-line: var(--k-r600);
  --brand: var(--k-chalk); --on-brand: var(--k-racing); --brand-hover: var(--k-s200);
  --read: var(--k-brass); --link: var(--k-chalk); --focus: var(--k-brass);
  --grid: var(--k-r700); --track: var(--k-r800); --context: var(--k-s500); --ctx-band: var(--k-r700);
  --s1: #3A82D6; --s2: #D9662F; --s3: #17A07D;
  --band: rgba(243, 244, 240, .16); --hl-row: var(--k-r700);
  --callout-bg: var(--k-ink); --callout-text: var(--k-chalk); --callout-read: var(--k-brass);
  --b-hi: rgba(58, 130, 214, .34); --b-lo: rgba(217, 102, 47, .32); --b-mid: rgba(243, 244, 240, .16); --b-neu: rgba(143, 153, 147, .2);
  --p-hi: #3A82D6; --p-lo: #D9662F; --p-mid: var(--k-chalk); --p-neu: var(--k-s400);
  --v-pos: #6F9AD3; --v-neg: #D9805A;
  --head-bg: var(--k-racing); --head-line: var(--k-r700); --head-field: var(--k-r800);
  --hero-bg: var(--k-ink); --hero-line: var(--k-s800);
  --hero-estela: url("kerno/patterns/kerno-estela-bleed-ink.svg");
  --loader: url("kerno/motion/kerno-loader-racing.svg");
  --shade: rgba(12, 18, 16, .72);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --surface: var(--k-racing); --surface-2: var(--k-r800); --raised: var(--k-r800);
  --text: var(--k-chalk); --text-2: var(--k-s300); --muted: var(--k-s400); --faint: var(--k-s500);
  --rule: var(--k-r700); --rule-strong: var(--k-chalk); --field-line: var(--k-r600);
  --brand: var(--k-chalk); --on-brand: var(--k-racing); --brand-hover: var(--k-s200);
  --read: var(--k-brass); --link: var(--k-chalk); --focus: var(--k-brass);
  --grid: var(--k-r700); --track: var(--k-r800); --context: var(--k-s500); --ctx-band: var(--k-r700);
  --s1: #3A82D6; --s2: #D9662F; --s3: #17A07D;
  --band: rgba(243, 244, 240, .16); --hl-row: var(--k-r700);
  --callout-bg: var(--k-ink); --callout-text: var(--k-chalk); --callout-read: var(--k-brass);
  --b-hi: rgba(58, 130, 214, .34); --b-lo: rgba(217, 102, 47, .32); --b-mid: rgba(243, 244, 240, .16); --b-neu: rgba(143, 153, 147, .2);
  --p-hi: #3A82D6; --p-lo: #D9662F; --p-mid: var(--k-chalk); --p-neu: var(--k-s400);
  --v-pos: #6F9AD3; --v-neg: #D9805A;
  --head-bg: var(--k-racing); --head-line: var(--k-r700); --head-field: var(--k-r800);
  --hero-bg: var(--k-ink); --hero-line: var(--k-s800);
  --hero-estela: url("kerno/patterns/kerno-estela-bleed-ink.svg");
  --loader: url("kerno/motion/kerno-loader-racing.svg");
  --shade: rgba(12, 18, 16, .72);
  color-scheme: dark; }

/* ------------------------------------------------------------------ base */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--surface); color: var(--text); font: 420 15.5px/1.5 var(--f-sans); font-stretch: 98%; font-feature-settings: "kern"; -webkit-font-smoothing: antialiased; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--head-bg); }
button, select, input { font: inherit; color: inherit; }
a { color: var(--link); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
::selection { background: var(--hl-row); }
b, strong { font-weight: 620; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font: 500 11.5px/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ------------------------------------------------------------------ armazón */
/* el armazón ocupa siempre la ventana entera del visor, también al ampliarlo: fijo a los cuatro bordes y no dependiente
   de la cadena html → body → .app ni del margen inferior que el visor pueda reservar */
.app { position: fixed; inset: 0; padding-top: env(safe-area-inset-top, 0px); display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* cabecera Racing: logotipo horizontal negativo del kit, controles sobre R800 con filetes R700, texto Chalk / S300 */
.head { position: relative; z-index: 40; display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; min-height: var(--head);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--head-bg); color: var(--head-text); box-shadow: inset 0 -1px 0 var(--head-line); }
.brand { display: flex; align-items: center; gap: 16px; text-decoration: none; color: inherit; flex: none; }
.logo { width: 156px; line-height: 0; margin: -4px 0 -4px -12px; } /* archivo de 156 px ≈ marca de 126 px (81 %): por encima del mínimo de 120 */
.logo span { display: block; }
.logo svg { width: 100%; height: auto; display: block; }
.logo .pos { display: none !important; } /* la cabecera es siempre Racing: logotipo negativo */
.logo .neg { display: block !important; }
.prod { display: grid; gap: 4px; border-left: 1px solid var(--head-line); padding-left: 16px; }
.prod b { font: 500 11px/1 var(--f-mono); letter-spacing: .1em; color: var(--head-text); }
.prod span { font: 500 10.5px/1 var(--f-mono); letter-spacing: .1em; color: var(--head-muted); }
.ctx { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; margin-left: auto; min-width: 0; }
.ctx-f { display: grid; gap: 4px; min-width: 0; transition: opacity .2s var(--ease); }
.ctx-f select { min-width: 0; max-width: 260px; }
.ctx-f.off { opacity: .42; }
.ctx-f.off .label::after { content: " · no aplica aquí"; text-transform: none; letter-spacing: 0; }
.head .label { color: var(--head-muted); }
#varaTxt { color: var(--head-text); }
select, input[type="number"], input[type="search"], input[type="text"] { background-color: var(--surface-2); border: 1px solid var(--field-line); border-radius: 0; padding: 6px 28px 6px 10px; min-height: 34px; font-size: 14px; color: var(--text); }
input[type="number"], input[type="search"], input[type="text"] { padding-right: 10px; }
select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
select:hover, input:hover { border-color: var(--text-2); }
.ibtn { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 6px 10px; border: 1px solid var(--field-line); border-radius: 0; background: transparent; cursor: pointer; font-size: 14px; color: var(--text); transition: border-color .2s var(--ease), background-color .2s var(--ease); }
.ibtn:hover { border-color: var(--text); }
.ibtn svg { width: 18px; height: 18px; flex: none; }
.ibtn kbd { font: 500 11px var(--f-mono); color: var(--muted); border: 1px solid var(--rule); padding: 1px 5px; }
.head select, .head .ibtn { background-color: var(--head-field); color: var(--head-text); border-color: var(--head-line); }
.head select { background-image: linear-gradient(45deg, transparent 50%, var(--head-muted) 50%), linear-gradient(135deg, var(--head-muted) 50%, transparent 50%); }
.head select:disabled { opacity: .55; }
.head .ibtn:hover, .head select:hover { border-color: var(--k-r300); }
.head .ibtn kbd { color: var(--head-muted); border-color: var(--head-line); }
.head option, .head optgroup { background: var(--surface); color: var(--text); }
.head :focus-visible { outline-color: var(--k-brass); }
.hnav { display: flex; align-items: center; gap: 8px; flex: none; }
.hnav .ibtn { padding: 6px 12px 6px 9px; font-weight: 500; }
.head .hnav .ibtn:disabled { opacity: .4; cursor: default; }
.head .hnav .ibtn:disabled:hover { border-color: var(--head-line); }
@media (min-width: 861px) and (max-width: 1499px) { .prod { display: none; } }
@media (min-width: 861px) and (max-width: 1299px) { .hnav .ibtn { padding: 6px 9px; } .hnav .ibtn span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } }
@media (max-width: 520px) { .hnav { margin-left: auto; } .hnav .ibtn { padding: 6px 9px; } .hnav .ibtn span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } }

/* botones: primario relleno Racing con texto Chalk (Chalk con texto Racing en oscuro); secundario solo filete */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 7px 16px; border: 1.5px solid var(--brand); background: var(--brand); color: var(--on-brand); border-radius: 0; cursor: pointer; font: 600 14px/1.2 var(--f-sans); text-decoration: none; transition: background-color .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease); }
.btn:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
.btn.sec { background: transparent; color: var(--brand); border-color: var(--brand); }
.btn.sec:hover { background: var(--hl-row); }
.btn.quiet { background: transparent; color: var(--text); border: 1px solid var(--field-line); font-weight: 500; }
.btn.quiet:hover { border-color: var(--brand); background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }

/* cuerpo: raíl + área de trabajo */
.body { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 0; }

/* raíl de decisión: superficie Chalk (oscuro: Racing), pasos en Geist Mono, activo con filete Racing (oscuro: Chalk) */
.rail { background: var(--surface); border-right: 1px solid var(--rule); overflow-y: auto; padding: 20px 0 calc(32px + env(safe-area-inset-bottom, 0px)); padding-left: max(0px, env(safe-area-inset-left, 0px)); }
.rail .sec { padding: 0 16px 0 20px; display: grid; gap: 1px; margin-bottom: 22px; }
.sec-h { display: grid; grid-template-columns: 22px 1fr; gap: 0 8px; align-items: baseline; margin-bottom: 6px; padding-top: 10px; border-top: 1px solid var(--rule); }
.rail .sec:first-child .sec-h { border-top: 0; padding-top: 0; }
.sec-h .n { font: 500 11.5px var(--f-mono); letter-spacing: .04em; color: var(--text); font-variant-numeric: tabular-nums; }
.sec-h .t { font: 620 13.5px/1.2 var(--f-sans); letter-spacing: .005em; }
.sec-h .q { grid-column: 2; font: 420 12.5px/1.35 var(--f-sans); color: var(--muted); margin-top: 2px; }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; border: 0; background: transparent; cursor: pointer;
  padding: 6px 10px 6px 28px; margin-left: -10px; width: calc(100% + 10px); border-radius: 0; font-size: 14px; color: var(--text-2);
  box-shadow: inset 3px 0 0 transparent; transition: background-color .16s var(--ease), color .16s var(--ease), box-shadow .16s var(--ease); }
.nav:hover { background: var(--raised); color: var(--text); }
.nav[aria-current="page"] { color: var(--text); font-weight: 620; background: var(--surface-2); box-shadow: inset 3px 0 0 var(--brand); }
.nav .new { font: 500 9.5px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--rule); padding: 2px 4px; }
.rail-foot { display: grid; gap: 6px; border-top: 1px solid var(--rule); margin: 0 16px 0 20px; padding-top: 14px; }
.rail-foot p { margin: 0; font-size: 12.5px; color: var(--muted); }
.rail-foot .label { color: var(--text); }
/* sitios (v4.2): el producto en tres artifacts. Nombre del sitio arriba del raíl; lo de otro sitio, enlace a ese artifact */
/* raíl: los tres sitios de Kerno Analytics, qué hay en cada uno y dónde estás. Cada sitio lleva su inicial en Geist Mono
   (J · E · M); el sitio abierto va relleno en Racing (oscuro: Chalk) y con el texto «Estás aquí»: nunca solo por color */
.rail-sitios { display: grid; gap: 6px; margin: 0 16px 24px 20px; padding-bottom: 18px; border-bottom: 1px solid var(--rule); }
.rail-sitios > .label { margin-bottom: 2px; }
.sitio { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 1px 10px; align-items: center; width: 100%; padding: 9px 10px; border: 1px solid var(--rule); background: transparent; color: var(--text); text-decoration: none; text-align: left; font: inherit; cursor: pointer; }
a.sitio:hover, button.sitio:hover { background: var(--raised); }
.sitio .ini, .rail-grupo .ini { display: grid; place-items: center; font: 500 12px/1 var(--f-mono); letter-spacing: .02em; border: 1px solid var(--rule-strong); color: var(--text); }
.sitio .ini { grid-row: 1 / 4; align-self: start; width: 28px; height: 28px; }
.sitio b { font: 620 14px/1.2 var(--f-sans); letter-spacing: .005em; }
.sitio small { grid-column: 2 / 4; font: 420 12px/1.35 var(--f-sans); color: var(--muted); }
.sitio .cnt { grid-column: 2 / 4; margin-top: 4px; font: 500 9.5px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); }
.sitio .est { display: inline-flex; align-items: center; font: 500 9.5px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.sitio.aqui { background: var(--surface-2); border-color: var(--rule-strong); box-shadow: inset 3px 0 0 var(--brand); cursor: default; }
.sitio.aqui:hover { background: var(--surface-2); }
.sitio.aqui .ini, .rail-grupo.aqui .ini { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.sitio.aqui .est { color: var(--text); }
.sitio.off { cursor: default; opacity: .6; }
.rail-grupo { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 1px 8px; align-items: center; margin: 0 16px 14px 20px; }
.rail-grupo .ini { grid-row: 1 / 3; width: 22px; height: 22px; font-size: 10.5px; }
.rail-grupo b { font: 620 12.5px/1.2 var(--f-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--text); }
.rail-grupo small { font: 420 12px/1.3 var(--f-sans); color: var(--muted); }
.rail-grupo.otro { margin-top: 6px; padding-top: 18px; border-top: 1px solid var(--rule-strong); }
.rail .rail-grupo + .sec .sec-h { border-top: 0; padding-top: 0; }
.rail .sec.fuera .sec-h { border-top-color: var(--rule); }
a.nav { text-decoration: none; }
.nav.fuera { color: var(--muted); }
.nav.fuera:hover { color: var(--text); }
.nav.fuera .k-arrow { opacity: .7; }
.nav .fuera-t { display: inline-flex; align-items: center; flex: none; font: 500 9.5px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.nav.off { cursor: default; opacity: .6; }
.nav.off:hover { background: transparent; color: var(--muted); }
.k-arrow { display: inline-block; width: .95em; height: .95em; margin: 0 0 0 .3em; vertical-align: -.1em; background: currentColor; flex: none;
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M3 12h16M13 6l6 6-6 6' fill='none' stroke='black' stroke-width='2'/></svg>") center / contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M3 12h16M13 6l6 6-6 6' fill='none' stroke='black' stroke-width='2'/></svg>") center / contain no-repeat; }

.main { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
/* cabecera de vista: ceja mono, título corto en Bombardier (H1), entradilla Mona en S700 */
.vhead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; padding-block: 18px 16px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--rule); background: var(--surface); }
.vhead h1 { margin: 8px 0 0; font: 400 34px/1 var(--f-display); letter-spacing: .03em; text-transform: uppercase; text-wrap: balance; }
.vhead p { margin: 8px 0 0; color: var(--text-2); font-size: 14.5px; line-height: 1.45; max-width: 78ch; }
.vhead .eyebrow span:first-child { color: var(--text); }
.aplica { display: grid; gap: 4px; justify-items: end; text-align: right; }
.aplica span:last-child { font: 450 12.5px var(--f-mono); color: var(--text-2); }
.pane { min-height: 0; overflow-y: auto; }
.pane[hidden] { display: none !important; }
.legacy { width: 100%; height: 100%; border: 0; display: block; background: var(--surface); }
.v40frame { width: 100%; min-height: 720px; border: 0; display: block; background: transparent; }
.view { padding-block: 24px calc(64px + env(safe-area-inset-bottom, 0px)); padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: grid; gap: 40px; max-width: 1680px; }

/* ------------------------------------------------------------------ cargando: la Estela se traza (loader del kit) */
.loading { display: grid; justify-items: start; gap: 12px; padding: 40px 0; color: var(--muted); }
.loading .estela { width: 56px; height: 64px; background: var(--loader) center / contain no-repeat; }

/* ------------------------------------------------------------------ piezas de lectura */
.eyebrow { font: 500 12px/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.read-h { margin: 0; font: 640 44px/48px var(--f-sans); font-stretch: 92%; letter-spacing: -.015em; text-wrap: balance; max-width: 21ch; }
.read-h.disp { font: 400 64px/62px var(--f-display); font-stretch: normal; letter-spacing: .03em; text-transform: uppercase; max-width: none; }
.read-lead { margin: 0; font: 420 20px/29px var(--f-sans); color: var(--text-2); max-width: 62ch; }
/* LA LECTURA: filete de latón bajo la cifra decisiva (Brass Deep en claro, Brass sobre Racing/oscuro). Uno por pantalla */
.hl { background-image: linear-gradient(var(--read), var(--read)); background-repeat: no-repeat; background-size: 100% 4px; background-position: 0 100%;
  padding-bottom: 3px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.h2 { margin: 0; font: 620 22px/28px var(--f-sans); font-stretch: 95%; letter-spacing: -.005em; text-wrap: balance; }
.h3 { margin: 0; font: 620 16px/21px var(--f-sans); font-stretch: 95%; }
.sub { margin: 6px 0 0; font: 500 11.5px/1.45 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.note { font-size: 13.5px; color: var(--muted); margin: 0; max-width: 80ch; }
.block { display: grid; gap: 16px; min-width: 0; }

/* Títulos de bloque · versión Kerno de la petición del CEO (06-11-2026): un marcador visible en cada título para delimitar
   las secciones de un vistazo. Antes era la marca Index (filete y cuadrado amarillos); ahora, filete superior Racing con un
   tramo inicial más grueso y unas mini-calles en Racing (Chalk en oscuro) junto al título. Sin amarillo ni latón: el latón
   queda solo para la lectura. */
.block-h { position: relative; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 20px; border-top: 1px solid var(--rule-strong); padding-top: 14px; }
.block-h::before { content: ""; position: absolute; left: 0; top: -1px; width: 64px; height: 4px; background: var(--brand); }
.block-h .h2::before { content: ""; display: inline-block; width: 13px; height: 11px; margin-right: 10px; vertical-align: 0;
  background: linear-gradient(to bottom, var(--brand) 0 2px, transparent 2px 3px, var(--brand) 3px 5px, transparent 5px 6px, var(--brand) 6px 8px, transparent 8px 9px, var(--brand) 9px 11px); }

/* etiquetas de evidencia (DATO · LECTURA · SUPUESTO): Geist Mono, filete en currentColor */
.tag { display: inline-flex; align-items: center; font: 500 10px/1 var(--f-mono); letter-spacing: .1em; padding: 4px 6px; border: 1px solid currentColor; border-radius: 0; color: var(--text-2); text-transform: uppercase; white-space: nowrap; }
.tag.dato { color: var(--brand); }
.tag.hip, .tag.supuesto { border-style: dashed; color: var(--text-2); }
.src { display: flex; align-items: flex-end; gap: 14px; margin: 0; border-top: 1px solid var(--rule); padding-top: 14px; font: 500 11.5px/1.5 var(--f-mono); color: var(--muted); letter-spacing: .02em; }
/* marcador de calles del pie: 8 marcas finas; la del paso actual (01–04), más alta y en latón */
.k-ticks { display: inline-flex; gap: 5px; align-items: flex-end; height: 14px; flex: none; margin-bottom: 3px; }
.k-ticks i { width: 2px; height: 9px; background: var(--context); }
.k-ticks i.on { height: 14px; width: 3px; background: var(--read); }

/* cifras clave: cifra en Bombardier, rango en Geist Mono; la tarjeta clave con filete Racing */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(156px, 100%), 1fr)); gap: 16px; }
.kpi { display: grid; gap: 8px; align-content: start; min-width: 0; background: var(--surface-2); border-top: 1px solid var(--rule); padding: 14px 16px 16px; }
.kpi.key { border-top: 3px solid var(--brand); padding-top: 12px; }
.kpi .v { font: 400 36px/1 var(--f-display); letter-spacing: .02em; font-variant-numeric: tabular-nums; color: var(--brand); }
.kpi .v.pos { color: var(--v-pos); }
.kpi .v.neg { color: var(--v-neg); }
.kpi .r { font: 450 12.5px/1.45 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .kpi { padding: 12px; } .kpi .v { font-size: 28px; } }

.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
@media (max-width: 1000px) { .split { grid-template-columns: minmax(0, 1fr); } }

/* tablas: cabecera de etiqueta mono con filete Racing, cifras mono a la derecha, fila protagonista en R100 (R700 en oscuro) */
.tw { overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { font: 500 10.5px/1.25 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 8px 10px; border-bottom: 1.5px solid var(--rule-strong); background: transparent; white-space: normal; vertical-align: bottom; overflow-wrap: normal; }
td { padding: 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
th.n, td.n { text-align: right; }
td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 13.5px; white-space: nowrap; }
td.num { font-family: var(--f-mono); font-size: 13px; }
td .btn { white-space: nowrap; }
tbody tr.go { cursor: pointer; }
tbody tr.go:hover td { background: var(--raised); }
tbody tr.top td { background: var(--hl-row); }
tbody tr.top td:first-child { box-shadow: inset 3px 0 0 var(--brand); }
tbody tr.sel td { background: var(--hl-row); font-weight: 620; }
tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--brand); }
.who { display: grid; gap: 2px; min-width: 160px; }
.who b { font-weight: 620; }
.who span { font-size: 12.5px; color: var(--muted); }
.rng { font: 450 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
td.n b { font-weight: 600; }

/* confianza: medidor de tres segmentos en Racing (Chalk en oscuro) + etiqueta */
.conf { display: inline-flex; align-items: center; gap: 8px; font: 500 12px var(--f-mono); white-space: nowrap; color: var(--text-2); }
.conf i { display: inline-grid; grid-template-columns: repeat(3, 7px); gap: 2px; height: 9px; }
.conf i::before, .conf i::after, .conf i span { content: ""; background: var(--ctx-band); }
.conf.alta i::before, .conf.alta i span, .conf.alta i::after, .conf.moderada i::before, .conf.moderada i span, .conf.baja i::before { background: var(--brand); }
.conf.alta { color: var(--text); }
.conf.mini { gap: 0; vertical-align: 1px; margin-left: 4px; } .conf.mini i { grid-template-columns: repeat(3, 5px); height: 7px; }

/* perfil por percentiles: banda = intervalo del 80 %, punto = estimación; marcas en 25 / 50 / 75 */
.pbar { position: relative; height: 18px; min-width: 120px; background: linear-gradient(90deg, transparent calc(25% - .5px), var(--grid) calc(25% - .5px) calc(25% + .5px), transparent calc(25% + .5px) calc(50% - .5px), var(--context) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px) calc(75% - .5px), var(--grid) calc(75% - .5px) calc(75% + .5px), transparent calc(75% + .5px)), var(--track); }
.pbar .b { position: absolute; top: 4px; bottom: 4px; background: var(--band); }
.pbar .p { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--brand); }
.pbar .p.s1 { background: var(--s1); } .pbar .p.s2 { background: var(--s2); } .pbar .p.s3 { background: var(--s3); }
.pbar .b.s1 { background: color-mix(in srgb, var(--s1) 30%, transparent); } .pbar .b.s2 { background: color-mix(in srgb, var(--s2) 30%, transparent); } .pbar .b.s3 { background: color-mix(in srgb, var(--s3) 30%, transparent); }
.pbar.multi { height: 36px; }
.pbar.multi .b { height: 6px; bottom: auto; }
.pbar.multi .p { height: 12px; bottom: auto; }
/* Lake por encima de la media de la vara, Clay por debajo, Racing/Sage en la zona media y en estilo */
.pbar.t-hi .b { background: var(--b-hi); } .pbar.t-hi .p { background: var(--p-hi); }
.pbar.t-lo .b { background: var(--b-lo); } .pbar.t-lo .p { background: var(--p-lo); }
.pbar.t-mid .b { background: var(--b-mid); } .pbar.t-mid .p { background: var(--p-mid); }
.pbar.t-neu .b { background: var(--b-neu); } .pbar.t-neu .p { background: var(--p-neu); }
.pbar.t-aj .b { background: var(--band); } .pbar.t-aj .p { background: var(--brand); }
.prof { display: grid; grid-template-columns: minmax(150px, 210px) minmax(120px, 1fr) minmax(130px, auto); gap: 6px 16px; align-items: center; }
.prof .g { grid-column: 1 / -1; margin-top: 14px; font: 620 14px var(--f-sans); border-bottom: 1px solid var(--rule-strong); padding-bottom: 5px; display: flex; justify-content: space-between; gap: 12px; }
.prof .g small { font: 420 12.5px var(--f-sans); color: var(--muted); }
.prof .m { font-size: 14px; }
.prof .m small { display: block; color: var(--muted); font-size: 12px; }
.prof .val { font: 450 13px var(--f-mono); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.prof .val b { font-weight: 600; }
.axis { display: flex; justify-content: space-between; font: 500 10.5px var(--f-mono); color: var(--muted); }
@media (max-width: 640px) { .prof { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .prof .m { grid-column: 1 / -1; } .prof .val { text-align: left; } }

/* barras divergentes (cuatro factores): Lake a favor, Clay en contra, desde el eje de la media */
.dv { position: relative; height: 14px; background: var(--track); min-width: 110px; }
.dv::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--rule-strong); }
.dv i { position: absolute; top: 3px; bottom: 3px; }
.dv i.up { background: var(--p-hi); } .dv i.dn { background: var(--p-lo); }

/* balance de victorias por etapa */
.wl { position: relative; height: 10px; background: var(--track); min-width: 90px; }
.wl::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--context); }
.wl i { position: absolute; left: 0; top: 2px; bottom: 2px; background: var(--brand); }

/* ranking con rangos: protagonista en Racing; el primero, punto de latón (la lectura dibujada) */
.rank { display: grid; grid-template-columns: minmax(150px, 240px) minmax(140px, 1fr) minmax(118px, auto); gap: 8px 16px; align-items: center; }
.rank .who { min-width: 0; }
.rank .val { font: 450 13px var(--f-mono); text-align: right; white-space: nowrap; }
.rank .val b { font-weight: 600; font-size: 14px; }
.rank > .pbar:nth-child(2) .p { background: var(--read); width: 4px; margin-left: -2px; }
@media (max-width: 640px) { .rank { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .rank .who { grid-column: 1 / -1; } }

/* tarjetas de acción: tarjeta con regla superior Racing, etiqueta mono, título Mona 620 y texto S700 */
.acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.act { display: grid; gap: 8px; align-content: start; text-align: left; border: 0; border-top: 2px solid var(--rule-strong); background: var(--surface-2); padding: 14px 16px 18px; cursor: pointer; border-radius: 0; transition: background-color .2s var(--ease); }
.act:hover { background: var(--hl-row); }
.act .label { color: var(--muted); }
.act b { font: 620 17px/22px var(--f-sans); font-stretch: 95%; }
.act span { font-size: 14px; color: var(--text-2); }

/* llamada: fondo Racing (Ink en oscuro), etiqueta mono en Brass, texto Chalk */
.callout { background: var(--callout-bg); color: var(--callout-text); padding: 18px 22px; display: grid; gap: 8px; }
.callout .label { color: var(--callout-read); }
.callout p { margin: 0; font-size: 15px; line-height: 1.5; }

/* controles */
.ctrls { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: flex-end; }
.ctrl { display: grid; gap: 6px; min-width: 0; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--field-line); }
.seg button { border: 0; background: transparent; padding: 6px 12px; min-height: 32px; cursor: pointer; font-size: 13.5px; color: var(--text-2); transition: background-color .16s var(--ease), color .16s var(--ease); }
.seg button:hover { background: var(--raised); color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--rule); background: var(--surface-2); padding: 8px 12px; cursor: pointer; border-radius: 0; text-align: left; display: grid; gap: 2px; transition: border-color .16s var(--ease); }
.chip b { font-size: 14px; font-weight: 620; }
.chip span { font-size: 12px; color: var(--muted); }
.chip:hover { border-color: var(--brand); }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); }
.chip[aria-pressed="true"] b { color: var(--on-brand); }
.chip[aria-pressed="true"] span { color: var(--on-brand); opacity: .78; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--brand); }
.weights { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--text-2); }
.weights span b { font-family: var(--f-mono); font-weight: 500; color: var(--text); }

/* ficha */
.idt { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14px; color: var(--text-2); }
.idt span b { color: var(--text); font-weight: 600; }
/* las cuatro preguntas (Encaje · Valor · Trayectoria · Riesgo) */
.q4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.q4 > div { padding: 14px 16px 16px; display: grid; gap: 6px; align-content: start; background: var(--surface-2); border-top: 2px solid var(--rule-strong); }
.q4 .label { color: var(--muted); }
.q4 .v { font: 620 19px/1.2 var(--f-sans); font-stretch: 95%; }
.q4 p { margin: 0; font-size: 13.5px; color: var(--text-2); }
@media (max-width: 900px) { .q4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .q4 { grid-template-columns: minmax(0, 1fr); gap: 10px; } }
.tabsrow { display: flex; flex-wrap: wrap; gap: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 6px; display: inline-block; }
/* gráficos: rejilla S200, ejes Geist Mono, banda de incertidumbre, protagonista Racing */
.chart { max-width: 820px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .zl { stroke: var(--context); stroke-width: 1; }
.chart .ax { font: 500 11px var(--f-mono); fill: var(--muted); }
.chart .bd { fill: var(--band); }
.chart .ln { stroke: var(--brand); stroke-width: 1.75; fill: none; }
.chart .pt { fill: var(--brand); }
.chart .pt.rd { fill: var(--read); stroke: var(--brand); stroke-width: 1.5; } /* la temporada más reciente: punto de latón */
.chart .lb { font: 500 12px var(--f-mono); fill: var(--text); }

/* ------------------------------------------------------------------ portadas (lectura de equipo y ficha)
   Racing (Ink en oscuro) con la Estela a sangre recortada a la derecha: una por pantalla. Titular largo en Mona 640 ancho 92,
   corto (nombre) en Bombardier mayúsculas; la lectura, filete de latón bajo la cifra decisiva; entradilla Mona en S300;
   las calles como cierre inferior. */
.block.hero { --read: var(--k-brass); --brand: var(--k-chalk); --on-brand: var(--k-racing); --brand-hover: var(--k-s200);
  background: var(--hero-bg); color: var(--hero-text); padding: 36px 40px 48px; gap: 18px; position: relative; overflow: hidden; isolation: isolate; }
