name: Intranet Basket Basko (extracción periódica)

# Periódico: lunes y jueves a las 05:17 UTC (tras las jornadas del fin de semana y las de entre semana).
# También se puede lanzar a mano desde la pestaña Actions ("Run workflow").
on:
  schedule:
    - cron: "17 5 * * 1,4"
  workflow_dispatch:
    inputs:
      rivales:
        description: "Rastrear también los equipos rivales"
        type: boolean
        default: false

permissions:
  contents: write   # sólo se usa si la variable BB_PUBLICAR = true (commit de data/basketbasko/processed)

concurrency:
  group: basketbasko
  cancel-in-progress: false

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Brutos y partidos ya descargados de ejecuciones anteriores (no se versionan: datos personales)
      - uses: actions/cache@v4
        with:
          path: |
            data/basketbasko/raw
            data/basketbasko/cache
          key: basketbasko-${{ github.run_id }}
          restore-keys: basketbasko-
      - name: Extraer y procesar
        env:
          BB_USUARIO: ${{ secrets.BB_USUARIO }}
          BB_PASSWORD: ${{ secrets.BB_PASSWORD }}
        run: |
          ARGS=(extraer)
          if [ "${{ inputs.rivales }}" = "true" ]; then ARGS+=(--rivales); fi
          python -m basketbasko "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: basketbasko-${{ github.run_number }}
          path: data/basketbasko/processed
          retention-days: 30
      - name: Publicar tablas procesadas en el repositorio
        if: vars.BB_PUBLICAR == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/basketbasko/processed
          git diff --cached --quiet || git commit -m "Datos intranet Basket Basko $(date -u +%Y-%m-%d)"
          git push
